<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1220">
<title>Carnet de séance · Calisthénie</title>
<style>
:root{--bg:#0E1220;--card:#171C2E;--in:#10152A;--line:#283050;--tx:#E9ECF6;--mu:#8A93B2;--kg:#F5B53D;--s:#4DD6E8;--rep:#B08CFF;--ok:#5BE3A0;--ko:#FF6B7A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:32px;font-weight:900;letter-spacing:-.03em;margin:8px 0 2px}
h2{font-size:19px;font-weight:800;margin:0}
p{margin:4px 0 12px}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--s);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:68px;padding:14px 18px;margin:10px 0;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800;text-align:left}
.big.today{border-color:var(--s);box-shadow:inset 0 0 0 1px var(--s)}
.back{background:none;color:var(--mu);padding:12px 4px;font-size:16px}
.b{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;padding:5px 11px;border-radius:999px;font-weight:800;font-size:15px;border:1.5px solid}
.b i{font-style:normal;font-size:12px}
.b-kg{color:var(--kg);border-color:var(--kg);background:#F5B53D22}
.b-s{color:var(--s);border-color:var(--s);background:#4DD6E822}
.b-rep{color:var(--rep);border-color:var(--rep);background:#B08CFF22}
.b-ok{color:var(--ok);border-color:var(--ok);background:#5BE3A022}
.b-ko{color:var(--ko);border-color:var(--ko);background:#FF6B7A22}
.b-mu{color:var(--mu);border-color:var(--line)}
.up{color:var(--ok)}.dn{color:var(--ko)}
.note{margin-top:8px;padding:8px 10px;border-left:3px solid var(--s);background:var(--in);border-radius:6px;font-size:14px;color:var(--mu)}
.pyr{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.pyr span{min-width:30px;text-align:center;padding:4px 0;border-radius:8px;background:var(--in);font-weight:800}
.pyr .hi{background:#B08CFF33;color:var(--rep)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{min-width:48px;height:48px;border-radius:12px;background:var(--in);border:1.5px solid var(--line);font-weight:800;font-size:16px}
.chip.on{background:var(--ok);border-color:var(--ok);color:#052013}
.chip.all{padding:0 14px;color:var(--mu)}
.chip.all.on{color:#052013}
.lab{font-size:14px;color:var(--mu);margin:6px 0 4px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step button{width:56px;height:56px;border-radius:14px;background:#222B4A;font-size:28px;font-weight:800}
.step output{flex:1;text-align:center;font-size:24px;font-weight:900}
.feels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.feels button{min-height:52px;padding:8px;border-radius:12px;background:var(--in);border:1.5px solid var(--line);font-weight:700;font-size:15px}
.feels .on{color:#06121A}
.feels [data-k=facile].on{background:var(--s);border-color:var(--s)}
.feels [data-k=parfait].on{background:var(--ok);border-color:var(--ok)}
.feels [data-k=dur].on{background:var(--kg);border-color:var(--kg)}
.feels [data-k=echec].on{background:var(--ko);border-color:var(--ko)}
.cta{width:100%;min-height:60px;margin:14px 0;border-radius:16px;background:var(--ok);color:#052013;font-weight:900;font-size:19px}
.sec{min-height:48px;padding:0 14px;margin:4px 4px 4px 0;border-radius:12px;background:#222B4A;font-weight:700}
.xp{height:10px;border-radius:9px;background:var(--in);overflow:hidden;margin-top:8px}
.xp i{display:block;height:100%;background:var(--s)}
.hr{padding:3px 0;border-top:1px solid var(--line);margin-top:4px}
#tm{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#1B2240;border-top:1px solid var(--line);font-size:22px;font-weight:900}
#tm button{min-width:64px;height:48px;margin-left:8px;border-radius:12px;background:#2B3560;font-size:15px;font-weight:700}
.rir{display:flex;gap:6px}.rir button{flex:1;height:48px;border-radius:12px;background:var(--in);border:1.5px solid var(--line);font-weight:800}.rir .on{background:var(--rep);border-color:var(--rep);color:#12082A}
textarea{width:100%;min-height:120px;background:var(--in);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:10px;font:13px monospace;margin-bottom:8px}
</style>
</head>
<body>
<main id="app"></main>
<div id="tm"><b id="tt"></b><span><button data-a="t+">+15 s</button><button data-a="tx">Fermer</button></span></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const KEY='calisthenie_v1',DAYS={mardi:'Mardi',mercredi:'Mercredi',samedi:'Samedi',dimanche:'Dimanche'},DOW={mardi:2,mercredi:3,samedi:6,dimanche:0};
const $=s=>document.querySelector(s);
const D=()=>({h:[],p:{},max:{d:15,t:8,p:28},xp:0,lv:{pl:0,fl:1},bk:0});
function load(){try{return Object.assign(D(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return D()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Sauvegarde impossible : le stockage du navigateur est indisponible.')}}
let S=load(),V={v:'home',day:null,last:null},SE=null;

/* ---- Programme (v = variable qui progresse) ---- */
const HB={id:'hb',n:'Hollow Body',t:'hold',sets:3,v:45};
const P={
 mardi:[HB,
  {id:'pl',n:'Planche Lean',t:'hold',sets:4,v:15,rest:120},
  {id:'tr',n:'Tractions · Pyramide',t:'pyr',v:6},
  {id:'di',n:'Dips · Force',t:'kg',sets:3,reps:3,v:20},
  {id:'po',n:'Pompes · EMOM',t:'emom',m:10,v:8}],
 mercredi:[HB,
  {id:'tp',n:'Planche',lad:'pl',t:'hold',sets:5,v:5},
  {id:'tr',n:'Tractions · Force',t:'reps',sets:3,v:6},
  {id:'di',n:'Dips · EMOM',t:'emom',m:10,v:4},
  {id:'po',n:'Pompes surélevées · Force',t:'reps',sets:3,v:8,rest:300},
  {id:'sp',n:'Scapula Pull-up',t:'kg',sets:4,reps:8,v:5,rest:240,note:'Pause de 3 s en haut de chaque rep.'}],
 samedi:[HB,
  {id:'tp',n:'Planche',lad:'pl',t:'hold',sets:5,v:8,rest:120},
  {id:'ng',n:'Front Lever · Negative hold',fig:1,t:'hold',sets:4,v:3,rest:120,note:'Full FL : tiens le plus longtemps en haut, puis redescends en contrôle.'},
  {id:'tr',n:'Tractions · Pyramide',t:'pyr',v:7},
  {id:'di',n:'Dips · EMOM',t:'emom',m:10,v:4},
  {id:'ah',n:'Arch Hangs',t:'reps',sets:3,v:8}],
 dimanche:[HB,
  {id:'tp',n:'Planche',lad:'pl',t:'hold',sets:4,v:7,rest:90},
  {id:'fl',n:'Front Lever',lad:'fl',t:'hold',sets:3,v:9,rest:90},
  {id:'tr',n:'Tractions · Force',t:'reps',sets:3,v:6,note:'Nombre de reps variable selon la forme du jour.'},
  {id:'di',n:'Dips · Force',t:'kg',sets:3,reps:3,v:20},
  {id:'po',n:'Pompes · EMOM',t:'emom',m:10,v:8},
  {id:'sp',n:'Scapula Pull-up',t:'kg',sets:4,reps:8,v:5,note:'Pause de 3 s en haut de chaque rep.'}]
};
/* ok = pas si ressenti bon, easy = pas si ressenti facile, dl = déchargement */
const T={
 hold:{c:'s',l:'Temps tenu par série',mx:2,up:(v,x)=>[v+1,x],dn:(v,x)=>[Math.max(3,Math.min(v-1,Math.round(v*.9))),x]},
 reps:{c:'rep',l:'Reps réalisées par série',mx:1,up:(v,x)=>[v+1,x],dn:(v,x)=>[Math.max(1,v-1),x]},
 kg:{c:'kg',l:'Lest utilisé',mx:2,up:(v,x)=>[v+1,x],dn:(v,x)=>[Math.max(0,v-2),x]},
 pyr:{c:'rep',mx:1,up:(v,x)=>x>60?[v,x-10]:[v+1,90],dn:(v,x)=>x<90?[v,x+10]:[Math.max(3,v-1),60]},
 emom:{c:'rep',l:'Reps par minute réalisées',mx:1,up:(v,x)=>x<12?[v,x+2]:[v+1,10],dn:(v,x)=>x>10?[v,x-2]:[Math.max(2,v-1),12]}
};
/* Séances Force : double progression (reps puis charge) + repos 5 min. v = charge (kg, 0 = poids du corps), x = reps par série */
T.dp={c:'kg',l:'Lest utilisé',mx:1,up:(v,x)=>v?(x<6?[v,x+1]:[v+2,3]):(x<15?[v,x+1]:[10,3]),dn:(v,x)=>v?(x>3?[v,x-1]:[Math.max(0,v-2),6]):[v,Math.max(3,x-1)]};
for(const d in P)P[d]=P[d].map(e=>/Force/.test(e.n)?e.id==='di'?{...e,t:'dp',x0:3,rest:300,note:'3 → 6 reps ; quand 3×6 devient facile : +2 kg et retour à 3 reps.'}:e.id==='tr'?{id:'tf',n:'Tractions · Force',t:'dp',sets:3,x0:6,v:0,rest:300,note:'Poids du corps jusqu’à 15 strictes, puis lestées : 3 → 6 reps, puis +2 kg.'}:{...e,rest:300}:e);
/* ---- V2 : séance guidée (série par série) ---- */
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function beep(f,d){try{const c=beep.c||(beep.c=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();c.resume&&c.resume();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
let WL=null,eI;
const wake=async()=>{try{WL=await navigator.wakeLock.request('screen')}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SE&&SE.g)wake()});
const sv=()=>{try{SE?localStorage.setItem('calisthenie_se',JSON.stringify({SE,day:V.day})):localStorage.removeItem('calisthenie_se')}catch(e){}};
let RS=(()=>{try{const o=JSON.parse(localStorage.getItem('calisthenie_se')||'null');return o&&o.SE&&o.SE.g?o:null}catch(e){return null}})();
const cs=()=>{const g=SE.g,e=P[V.day][g.ei],r=SE.ex[e.id];return{g,e,r,o:r.L[g.si]}};
const tt=(e,r,i)=>e.t==='pyr'?seq(r.tg)[i]+' reps':e.t==='kg'?e.reps+' reps · '+fmt(e,r.tg):fmt(e,r.tg,r.x);
const lt=(d,e)=>{const p=last(d,e.id);return p?`<div class=mu>La dernière fois : ${fmt(p,p.act,p.x)}${p.q!=null?' · effort '+p.q:''}${p.a==='up'?' ▲':''}</div>`:''};
/* ajuste la cible de la série suivante d'après la série qui vient d'être saisie */
function adj(){const{g,e,o}=cs();g.msg='';g.cur2=g.cur;
 if(e.t==='hold'){if(o.a<.8*g.cur||o.fm==='bad'){g.cur2=Math.max(3,g.cur-1);g.msg='Cible −1 s sur la prochaine série, repos +30 s conseillé ('+(o.fm==='bad'?'forme moyenne':'tenue courte')+').'}}
 else if(o.q>=3&&(e.t==='dp'||e.t==='kg'))g.msg='RIR '+(o.q>=4?'4+':o.q)+' : tu peux ajouter +2 kg sur la série suivante.';
 else if(o.q===0)g.msg='Limite atteinte : allège ou prends un repos plus long.'}
/* convertit les séries saisies en résumé d'exercice pour le moteur de progression (A.fin) */
function drv(e){const r=SE.ex[e.id],Ls=r.L.filter(Boolean);if(!Ls.length)return;
 if(e.t!=='emom')r.L.forEach((o,i)=>{if(o)r.d[i]=e.t==='pyr'?o.a>=seq(r.tg)[i]:true});
 r.a=Math.min(...Ls.map(o=>o.a));if(e.t==='dp')r.ax=Math.min(...Ls.map(o=>o.ax));
 const qs=Ls.map(o=>o.q).filter(v=>v!=null),ql=qs.length?qs[qs.length-1]:null;
 r.q=ql==null?null:Math.max(0,ql);
 const bad=Ls.filter(o=>o.fm==='bad').length,gd=Ls.filter(o=>o.fm==='good').length;
 r.fm=bad*2>=Ls.length?'bad':gd?'good':'ok0';
 r.f=Ls.some(o=>o.q<0)?'echec':r.q==null?'parfait':r.q>=3?'facile':r.q>=1?'parfait':'dur'}
function ef(){const g=SE&&SE.g;if(!g||g.ph!=='eff')return clearInterval(eI);const e=P[V.day][g.ei],r=SE.ex[e.id],n=g.pz||Date.now(),b=$('#bt');if(!b)return;
 if(n<g.t0){b.textContent=Math.ceil((g.t0-n)/1000);$('#bm').textContent='Place-toi…';return}
 if(e.t==='hold'){const s=Math.floor((n-g.t0)/1000);b.textContent=s+' s';$('#bm').textContent='';$('#bb').style.width=Math.min(100,s/g.cur*100)+'%';if(s>=g.cur&&!g.hit){g.hit=1;beep(988,.3);buzz([200,100,200])}}
 else{const el=(n-g.t0)/1000,m=Math.floor(el/60);if(m>=r.x)return A.stop();if(m!==g.lm){g.lm=m;beep(880,.2);buzz(150)}b.textContent=Math.ceil(60-el%60)+' s';$('#bm').textContent='Minute '+(m+1)+'/'+r.x+' · '+r.tg+' reps'}}
function startEff(){const g=SE.g,e=P[V.day][g.ei];g.ph='eff';g.hit=0;g.lm=-1;g.pz=0;g.t0=Date.now()+(e.t==='hold'||e.t==='emom'?5000:0);clearInterval(eI);eI=setInterval(ef,200);sv();nav('ses');ef()}
/* Carte sauvegarde : rappel d'export si pas de fichier récent */
const bk=()=>{const dj=S.bk?Math.floor((Date.now()-S.bk)/864e5):null,w=S.h.length&&(dj===null||dj>=7);return `<div class=card>${w?`<div class=note style="margin:0 0 10px;border-color:var(--kg)">⚠️ ${dj===null?'Tes données ne sont pas encore sauvegardées dans un fichier.':'Dernière sauvegarde en fichier : il y a '+dj+' jours.'} Exporte-les : le navigateur peut effacer son stockage.</div>`:''}<div class=mu>Tes données sont stockées dans ce navigateur uniquement.</div><button class=sec data-a=exp>⬇ Exporter</button><button class=sec data-a=imp>⬆ Importer</button><button class=sec data-a=go data-t=sav>📋 Par texte</button></div>`};
/* Paliers des figures : [nom, secondes à tenir en bonne forme pour passer au niveau suivant] */
const L={pl:[['Tuck Planche',20],['Advanced Tuck Planche',15],['Straddle Planche',12],['Full Planche',10]],fl:[['Tuck Front Lever',20],['Advanced Tuck FL',15],['One Leg FL',12],['Straddle FL',10],['Full Front Lever',10]]};
const F=[{k:'facile',l:'😎 Facile'},{k:'parfait',l:'✅ Validation parfaite'},{k:'dur',l:'😤 Dur mais validé'},{k:'echec',l:'💀 Échec / trop dur'}];
const R=['Recrue','Initié','Athlète','Gladiateur','Maître','Légende'];

/* ---- Utilitaires ---- */
const xd=e=>e.t==='emom'?10:e.t==='pyr'?90:e.t==='dp'?e.x0:0;
const cur=(d,e)=>S.p[d+'.'+e.id]??e.v;
const curx=(d,e)=>S.p[d+'.'+e.id+'.x']??xd(e);
const nm=e=>e.lad?L[e.lad][S.lv[e.lad]][0]:e.n;
const gl=e=>e.lad?`<div class=note>Palier : ${L[e.lad][S.lv[e.lad]][1]} s en bonne forme → ${(L[e.lad][S.lv[e.lad]+1]||[])[0]||'niveau max'}</div>`:'';
function setLv(k,i,up){S.lv[k]=i;for(const d in P)P[d].forEach(e=>{if(e.lad===k)S.p[d+'.'+e.id]=up?Math.max(3,Math.round(e.v*.6)):e.v})}
const ex=id=>P[V.day].find(e=>e.id===id);
const lv=()=>Math.floor(S.xp/300)+1,rank=()=>R[Math.min(lv()-1,R.length-1)];
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const seq=n=>{const a=[];for(let i=1;i<=n;i++)a.push(i);for(let i=n-1;i>0;i--)a.push(i);return a};
const fmt=(e,v,x=xd(e))=>({hold:v+' s',reps:v+' reps',kg:'+'+v+' kg',pyr:v+' sommets · repos '+mmss(x),emom:v+' reps/min × '+x+' min',dp:x+' reps'+(v?' · +'+v+' kg':' · poids du corps')})[e.t];
const desc=(e,v,x=xd(e))=>({hold:`${e.sets} séries × ${v} s`,reps:`${e.sets} séries × ${v} reps`,kg:`${e.sets} séries × ${e.reps} reps`,pyr:`${2*v-1} séries · 1 → ${v} → 1`,emom:`EMOM ${x} min · ${v} reps chaque minute`,dp:`${e.sets} séries × ${x} reps${v?' · lest +'+v+' kg':' · poids du corps'}`})[e.t];
const badge=(e,v,x)=>{const dl=v-e.v;return `<span class="b b-${e.t==='dp'&&!v?'rep':T[e.t].c}">${fmt(e,v,x)}${dl?` <i class="${dl>0?'up':'dn'}">${dl>0?'▲+':'▼'}${Math.abs(dl)}</i>`:''}</span>`};
const restOf=(e,i,r)=>e.t==='pyr'?(seq(r.tg)[i]<=4?40:r.x):(e.rest||0);
const last=(day,id)=>{for(let i=S.h.length-1;i>=0;i--){const h=S.h[i];if(h.day!==day)continue;const r=h.res.find(x=>x.id===id);if(r)return r}return null};
const back=t=>`<button class=back data-a=go data-t=${t}>‹ Retour</button>`;
/* Tests max : un dimanche toutes les 4 semaines depuis le 8 novembre 2026 */
const DAYMS=864e5,T0=Date.UTC(2026,10,8);
const today=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
const ntStr=()=>{const k=Math.max(0,Math.ceil((today()-T0)/(28*DAYMS))),d=new Date(T0+k*28*DAYMS);return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})+(+d===today()?' · aujourd’hui !':'')};

/* ---- Minuteur de repos ---- */
let tEnd=0,tI,tP=0;
function tick(){const l=Math.ceil((tEnd-(tP||Date.now()))/1000),r=$('#rt'),b=r||$('#tt');$('#tm').style.display=r?'none':'flex';if(l<=0){clearInterval(tI);b.textContent='Go ! 💪';beep(988,.3);buzz([250,120,250]);return}b.textContent=(r?'':'Repos ')+mmss(l)}
function rest(s){tP=0;clearInterval(tI);tEnd=Date.now()+s*1000;tick();tI=setInterval(tick,250)}

/* ---- Vues ---- */
const stp=(a,k,v,s)=>`<div class=step><button data-a=${a} data-id=${k} data-k=${k} data-s=-1>−</button><output>${v}</output><button data-a=${a} data-id=${k} data-k=${k} data-s=1>+</button></div>`;
const card=e=>{const r=SE.ex[e.id],t=T[e.t];return `<div class=card><div class=row><h2>${nm(e)}</h2>${badge(e,r.tg,r.x)}</div><div class=mu>${desc(e,r.tg,r.x)}${e.rest&&e.t!=='pyr'?' · repos '+mmss(e.rest):''}</div>
<div class=chips>${r.d.map((x,i)=>`<button class="chip${x?' on':''}" data-a=chip data-id=${e.id} data-i=${i}>${e.t==='pyr'?seq(r.tg)[i]:i+1}</button>`).join('')}<button class="chip all${r.d.every(Boolean)?' on':''}" data-a=all data-id=${e.id}>✔ Tout</button></div>
${e.t==='pyr'?'':`<div class=lab>${t.l}</div>${stp('inc',e.id,e.t==='dp'?(r.a?'+'+r.a+' kg':'poids du corps'):fmt(e,r.a,r.x))+(e.t==='dp'?`<div class=lab>Reps réalisées par série</div>`+stp('incx',e.id,r.ax+' reps'):'')}`}
${e.note?`<div class=note>${e.note}</div>`:''}${gl(e)}
${e.lad||e.fig?`<div class=lab>Qualité de la forme</div><div class=feels><button class="${r.fm==='good'?'on':''}" data-k=facile data-a=form data-id=${e.id} data-v=good>✅ Bonne forme</button><button class="${r.fm==='bad'?'on':''}" data-k=echec data-a=form data-id=${e.id} data-v=bad>⚠️ Mauvaise forme</button></div>`:''}
<div class=lab>${e.t==='hold'?'Fin de série : tu aurais pu tenir encore…':'RIR : reps en réserve à la fin'}</div><div class=rir>${(e.t==='hold'?[[3,'+3 s ou plus'],[1,'+1 à 2 s'],[0,'Limite']]:[0,1,2,3,4,5].map(i=>[i,i<5?i:'5+'])).map(([i,l])=>`<button class="${r.q===i?'on':''}" data-a=rir data-id=${e.id} data-v=${i}>${l}</button>`).join('')}</div>

 if(e.t==='hold')o.a=Math.max(0,Math.floor((n-g.t0)/1000));

 if(e.t==='emom'){const m=Math.max(0,Math.min(r.x,Math.floor((n-g.t0)/60000)));r.d.fill(false);r.d.fill(true,0,m)}
 r.L[i]=o;adj();g.ph='rest';const s=restOf(e,i,r)||90;tEnd=Date.now()+s*1000;nav('ses');rest(s);g.rend=tEnd;sv()},

 if(g.si<(e.t==='emom'?1:r.d.length)-1){g.si++;if(e.t==='hold'&&g.cur2)g.cur=g.cur2;startEff();return}
 if(g.ei<E.length-1){g.ei++;g.si=0;g.ph='prep';sv();nav('ses')}else A.done()},

fin:()=>{const day=V.day,res=[];let xp=0;
 const miss=P[day].find(e=>{const r=SE.ex[e.id];return r.d.some(Boolean)&&(!r.f||((e.lad||e.fig)&&!r.fm))});
 if(miss)return alert('Choisis le ressenti'+(miss.lad||miss.fig?' et la forme':'')+' pour « '+nm(miss)+' ».');
 for(const e of P[day]){const r=SE.ex[e.id];if(!r.d.some(Boolean)&&!r.f)continue;
  const t=T[e.t],tg=r.tg,n=r.d.length,dn=r.d.filter(Boolean).length,ok=dn===n&&(e.t==='pyr'||r.a>=tg)&&(e.t!=='dp'||r.ax>=r.x),fig=e.lad||e.fig,lad=e.lad,lv=lad&&S.lv[lad],key=day+'.'+e.id,p=last(day,e.id),name=nm(e);
  const eq=[r.q,r.p==null?null:10-r.p].filter(v=>v!=null),qq=eq.length?Math.min(...eq):null,lvl=r.f==='echec'?0:qq==null?{facile:2,parfait:1,dur:0}[r.f]:qq>=3?2:qq>=1?1:0;
  let nv=tg,nx=r.x,a='keep',msg;
  if(fig&&r.fm==='bad'){
   if(p&&p.fm==='bad'&&lad&&lv>0){a='down';msg='Forme dégradée deux séances de suite : retour à '+L[lad][lv-1][0]+'.';setLv(lad,lv-1,0)}

  else if(!ok)msg='Séries incomplètes : même difficulté la prochaine fois.';
  else if(lvl===0)msg='Validé mais à la limite : on consolide avant de monter.';
  else if(lad&&r.fm==='good'&&r.a>=L[lad][lv][1]&&lv<L[lad].length-1){a='up';msg='Palier atteint : passage à '+L[lad][lv+1][0]+' !';setLv(lad,lv+1,1)}
  else if(e.t==='dp'&&lvl<2&&Math.max(tg,r.a)>0&&Math.max(r.x,r.ax)>=6)msg='Haut de la fourchette atteint : encore une séance facile (RIR 3+ ou RPE ≤ 7) avant d’augmenter la charge.';
  else{nv=Math.max(tg,r.a);if(e.t==='dp')nx=Math.max(r.x,r.ax);for(let i=0;i<Math.min(lvl,t.mx);i++)[nv,nx]=t.up(nv,nx);a='up';msg=lvl>1?'Très facile (RIR élevé) : grosse progression.':'Séance maîtrisée : la difficulté augmente.';if(e.t==='dp'&&nx===3&&nv>Math.max(tg,r.a))msg='Fourchette terminée : charge à +'+nv+' kg, on repart à 3 reps.'}
  if(lad&&S.lv[lad]!==lv)nv=S.p[key];else{S.p[key]=nv;S.p[key+'.x']=nx}

  res.push({id:e.id,n:name,t:e.t,tg,x:e.t==='dp'?r.ax:r.x,act:r.a,dn,sets:n,f:r.f,q:r.q,rp:r.p,fm:r.fm,ok,next:nv,nx,a,msg})}
 if(!res.length&&!(day==='dimanche'&&SE.mx.on))return alert('Valide au moins une série avant de terminer.');
 let mx=null;
 if(day==='dimanche'&&SE.mx.on){const rec=['d','t','p'].filter(k=>SE.mx[k]>S.max[k]);mx={d:SE.mx.d,t:SE.mx.t,p:SE.mx.p,rec};['d','t','p'].forEach(k=>S.max[k]=SE.mx[k]);xp+=100+50*rec.length}
