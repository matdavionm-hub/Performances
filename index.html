<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Carnet de séance · Calisthénie</title>
<style>
:root{--bg:#0E1220;--card:#171C2E;--in:#10152A;--line:#283050;--tx:#E9ECF6;--mu:#8A93B2;--kg:#F5B53D;--s:#4DD6E8;--rep:#B08CFF;--ok:#5BE3A0;--ko:#FF6B7A;--bt:#222B4A;--tmbg:#1B2240;--tmb:#2B3560;--z:1}
:root[data-theme=light]{--bg:#F3F5FB;--card:#FFFFFF;--in:#EDF0F8;--line:#D3DAEA;--tx:#161B2E;--mu:#5A6480;--kg:#B26A00;--s:#0A86A0;--rep:#6A3FD0;--ok:#0E8F5F;--ko:#D6293E;--bt:#E1E6F4;--tmbg:#FFFFFF;--tmb:#E1E6F4}
:root[data-theme=light] .cta,:root[data-theme=light] .feels .on,:root[data-theme=light] .rir .on,:root[data-theme=light] .sec.on{color:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;zoom:var(--z);padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:32px;font-weight:900;letter-spacing:-.03em;margin:8px 0 2px}
h2{font-size:19px;font-weight:800;margin:0}
p{margin:4px 0 12px}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--s);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:68px;padding:14px 18px;margin:10px 0;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800;text-align:left}
.big.today{border-color:var(--s);box-shadow:inset 0 0 0 1px var(--s)}
.back{background:none;color:var(--mu);padding:12px 4px;font-size:16px}
.b{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;padding:5px 11px;border-radius:999px;font-weight:800;font-size:15px;border:1.5px solid}
.b i{font-style:normal;font-size:12px}
.b-kg{color:var(--kg);border-color:var(--kg);background:#F5B53D22}
.b-s{color:var(--s);border-color:var(--s);background:#4DD6E822}
.b-rep{color:var(--rep);border-color:var(--rep);background:#B08CFF22}
.b-ok{color:var(--ok);border-color:var(--ok);background:#5BE3A022}
.b-ko{color:var(--ko);border-color:var(--ko);background:#FF6B7A22}
.b-mu{color:var(--mu);border-color:var(--line)}
.up{color:var(--ok)}.dn{color:var(--ko)}
.note{margin-top:8px;padding:8px 10px;border-left:3px solid var(--s);background:var(--in);border-radius:6px;font-size:14px;color:var(--mu)}
.note.w{border-color:var(--kg)}.note.d{border-color:var(--ko)}
.pyr{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.pyr span{min-width:30px;text-align:center;padding:4px 0;border-radius:8px;background:var(--in);font-weight:800}
.pyr .hi{background:#B08CFF33;color:var(--rep)}
.lab{font-size:14px;color:var(--mu);margin:6px 0 4px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step button{width:56px;height:56px;border-radius:14px;background:var(--bt);font-size:28px;font-weight:800}
.step output{flex:1;text-align:center;font-size:24px;font-weight:900}
.feels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.feels button{min-height:52px;padding:8px;border-radius:12px;background:var(--in);border:1.5px solid var(--line);font-weight:700;font-size:15px}
.feels .on{color:#06121A}
.feels [data-k=facile].on{background:var(--s);border-color:var(--s)}
.feels [data-k=parfait].on{background:var(--ok);border-color:var(--ok)}
.feels [data-k=dur].on{background:var(--kg);border-color:var(--kg)}
.feels [data-k=echec].on{background:var(--ko);border-color:var(--ko)}
.cta{width:100%;min-height:60px;margin:14px 0;border-radius:16px;background:var(--ok);color:#052013;font-weight:900;font-size:19px}
.cta.warn{background:var(--kg);color:#241600}
.sec{min-height:48px;padding:0 14px;margin:4px 4px 4px 0;border-radius:12px;background:var(--bt);font-weight:700}
.sec.on{background:var(--s);color:#06121A}
.xp{height:10px;border-radius:9px;background:var(--in);overflow:hidden;margin-top:8px}
.xp i{display:block;height:100%;background:var(--s)}
.hr{padding:3px 0;border-top:1px solid var(--line);margin-top:4px}
#tm{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--tmbg);border-top:1px solid var(--line);font-size:22px;font-weight:900}
#tm button{min-width:64px;height:48px;margin-left:8px;border-radius:12px;background:var(--tmb);font-size:15px;font-weight:700}
.rir{display:flex;gap:6px}.rir button{flex:1;height:48px;border-radius:12px;background:var(--in);border:1.5px solid var(--line);font-weight:800;font-size:15px}.rir .on{background:var(--rep);border-color:var(--rep);color:#12082A}
.wui{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;padding:10px 12px;margin:6px 0;border-radius:12px;background:var(--in);border:1.5px solid var(--line);text-align:left}
.wui.on{border-color:var(--ok);background:#5BE3A022}
.ban{border-color:var(--kg);background:#F5B53D18}
.sc{height:12px;border-radius:9px;background:var(--in);overflow:hidden;margin-top:8px}.sc i{display:block;height:100%}
body.clean .big{min-height:52px;justify-content:center}
body.clean .card:has(>.hlp:only-child),body.clean .hlp,body.clean .hint,body.clean .big>.mu:not(.keep){display:none}
select.sel,input.sel{width:100%;background:var(--in);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;margin-bottom:6px}
input[type=time]{background:var(--in);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:20px;font-weight:800}
.dys{display:flex;gap:6px;margin:6px 0}.dys button{flex:1;height:44px;border-radius:10px;background:var(--in);border:1.5px solid var(--line);font-weight:800;font-size:14px}.dys .on{background:var(--s);border-color:var(--s);color:#06121A}
:root[data-theme=light] .dys .on{color:#fff}
textarea{width:100%;min-height:120px;background:var(--in);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:10px;font:13px monospace;margin-bottom:8px}
svg text{fill:var(--mu);font-size:11px}
/* ---- Style « Phantom » (rouge / noir / blanc, HUD de jeu) : activé dans Réglages > Style ---- */
.recb{background:var(--kg);color:#1a1200;font:400 34px/1.1 Anton,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:12px 0;transform:rotate(-3deg);margin:16px -8px;animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:rotate(-3deg) scale(2.4);opacity:0}100%{transform:rotate(-3deg) scale(1);opacity:1}}
.wipe{position:fixed;top:0;left:-20%;width:140%;height:100%;background:#E60012;z-index:90;pointer-events:none;transform:translateX(-130%) skewX(-18deg);animation:wipe .42s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wipe{0%{transform:translateX(-130%) skewX(-18deg)}100%{transform:translateX(130%) skewX(-18deg)}}
@keyframes stripes{from{background-position:0 0,0 0}to{background-position:88px 0,0 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
:root[data-sk=ph]{--bg:#0A0A0A;--card:#141414;--in:#0D0D0D;--line:#3a3a3a;--tx:#fff;--mu:#a3a3a3;--kg:#FFD400;--s:#E60012;--rep:#fff;--ok:#2ECC71;--ko:#FF4D5A;--bt:#222;--tmbg:#111;--tmb:#2a2a2a}
:root[data-sk=ph] body{background:repeating-linear-gradient(135deg,transparent 0 30px,rgba(230,0,18,.07) 30px 60px),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.6px) 0 0/9px 9px,#0A0A0A;background-attachment:fixed;animation:stripes 30s linear infinite}
:root[data-sk=ph] h1,:root[data-sk=ph] h2,:root[data-sk=ph] .big,:root[data-sk=ph] .cta,:root[data-sk=ph] .sec,:root[data-sk=ph] .back,:root[data-sk=ph] .dys button,:root[data-sk=ph] .b,:root[data-sk=ph] .nl b{font-family:Anton,Impact,'Arial Narrow','Roboto Condensed',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.03em}
:root[data-sk=ph] h1{font-size:40px;transform:skewX(-6deg);text-shadow:3px 3px 0 #E60012;margin:10px 0 6px;letter-spacing:.02em}
:root[data-sk=ph] h2{font-size:21px;transform:skewX(-6deg);display:inline-block;border-bottom:3px solid #E60012}
:root[data-sk=ph] .card{border:0;border-left:5px solid #E60012;border-radius:0;background:#141414;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
:root[data-sk=ph] .card.ban{border-left-color:#FFD400;background:#1d1a05}
:root[data-sk=ph] .big{border:0;border-left:5px solid #E60012;border-radius:0;background:#141414;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);padding-right:30px;transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
:root[data-sk=ph] .big.today{background:#fff;color:#0A0A0A;box-shadow:none}
:root[data-sk=ph] .big.today .mu{color:#333}
:root[data-sk=ph] .big:active,:root[data-sk=ph] .cta:active,:root[data-sk=ph] .sec:active{transform:translate(3px,3px) scale(.98)}
:root[data-sk=ph] .cta{border-radius:0;background:#E60012;color:#fff;font-size:24px;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);animation:pulse 2.4s ease-in-out infinite}
:root[data-sk=ph] .cta.warn{background:#FFD400;color:#000}
:root[data-sk=ph] .sec,:root[data-sk=ph] .dys button,:root[data-sk=ph] .rir button,:root[data-sk=ph] .feels button,:root[data-sk=ph] .step button,:root[data-sk=ph] .wui{border-radius:0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
:root[data-sk=ph] .sec.on,:root[data-sk=ph] .dys .on{background:#E60012;color:#fff;border-color:#E60012}
:root[data-sk=ph] .rir .on{background:#fff;color:#0A0A0A;border-color:#fff}
:root[data-sk=ph] .feels .on{color:#000}
:root[data-sk=ph] .feels [data-k=facile].on,:root[data-sk=ph] .feels [data-k=echec].on{color:#fff}
:root[data-sk=ph] .note{border-radius:0;border-left-color:#E60012;background:#0d0d0d}
:root[data-sk=ph] .b{border-radius:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);border-width:0;background:#222;padding:5px 14px}
:root[data-sk=ph] .b-kg{background:#FFD400;color:#000}
:root[data-sk=ph] .b-s{background:#E60012;color:#fff}
:root[data-sk=ph] .b-rep{background:#fff;color:#000}
:root[data-sk=ph] .b-ok{background:#2ECC71;color:#000}
:root[data-sk=ph] .b-ko{background:#FF4D5A;color:#000}
:root[data-sk=ph] .xp,:root[data-sk=ph] .sc{border-radius:0;height:14px;position:relative;transform:skewX(-14deg);background:#222}
:root[data-sk=ph] .xp i{background:linear-gradient(90deg,#E60012,#FFD400)}
:root[data-sk=ph] .xp::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 3px),#0A0A0A calc(5% - 3px) 5%)}
:root[data-sk=ph] .rd:before{background:#E60012;width:5px}
:root[data-sk=ph] .nc{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:0;background:#2a2a2a;color:#a3a3a3}
:root[data-sk=ph] .nc.dn{background:#fff;color:#0A0A0A}
:root[data-sk=ph] .nc.cu{background:#E60012;color:#fff;outline:0;animation:pulse 1.4s ease-in-out infinite}
:root[data-sk=ph] #tm{background:#E60012;color:#fff;border-top:0}
:root[data-sk=ph] #tm button{border-radius:0;background:#0A0A0A;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
:root[data-sk=ph] .hint{color:#FFD400}
:root[data-sk=ph] input[type=time],:root[data-sk=ph] select.sel,:root[data-sk=ph] input.sel,:root[data-sk=ph] textarea{border-radius:0}

@keyframes rise{from{background-position:0 0,0 0,0 0}to{background-position:0 0,96px 0,0 0}}
@keyframes scan{from{background-position:0 0,0 0,0 0}to{background-position:0 0,0 72px,0 0}}
@keyframes wob{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg) scale(1.015)}}
@keyframes slamb{0%{transform:skewX(-8deg) scale(2.2);opacity:0}100%{transform:skewX(-8deg) scale(1);opacity:1}}

/* ---- Style p3 ---- */
:root[data-sk=p3]{--bg:#06122B;--card:#0B2048;--in:#071735;--line:#1F4C94;--tx:#EAF6FF;--mu:#8FB3DE;--kg:#FFD166;--s:#3FD9FF;--rep:#A9C4FF;--ok:#4DF0B0;--ko:#FF6B8A;--bt:#12306A;--tmbg:#0B2048;--tmb:#1F4C94}
:root[data-sk=p3] body{background:linear-gradient(180deg,rgba(63,217,255,.10),transparent 38%),repeating-linear-gradient(115deg,transparent 0 46px,rgba(63,217,255,.05) 46px 48px),#06122B;background-attachment:fixed;animation:rise 24s linear infinite}
:root[data-sk=p3] h1,:root[data-sk=p3] h2,:root[data-sk=p3] .big,:root[data-sk=p3] .cta,:root[data-sk=p3] .sec,:root[data-sk=p3] .back,:root[data-sk=p3] .dys button,:root[data-sk=p3] .b,:root[data-sk=p3] .nl b{font-family:Oswald,'Arial Narrow','Roboto Condensed',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.04em}
:root[data-sk=p3] h1{font-size:38px;font-weight:700;transform:skewX(-8deg);color:#fff;text-shadow:0 0 18px rgba(63,217,255,.55);margin:10px 0 6px}
:root[data-sk=p3] h2{font-size:20px;font-weight:600;color:#3FD9FF;border-left:4px solid #3FD9FF;padding-left:10px}
:root[data-sk=p3] .card{border:1px solid #1F4C94;border-top:3px solid #3FD9FF;border-radius:0;background:linear-gradient(160deg,rgba(18,52,110,.92),rgba(8,24,54,.95));clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
:root[data-sk=p3] .card.ban{border-top-color:#FFD166}
:root[data-sk=p3] .big{border:1px solid #1F4C94;border-left:6px solid #3FD9FF;border-radius:0;background:linear-gradient(90deg,#0F2D63,#081a3c);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 100%,0 100%);padding-right:36px;transition:transform .18s ease,filter .18s}
:root[data-sk=p3] .big.today{background:linear-gradient(90deg,#fff,#CFEFFF);color:#06122B;border-left-color:#3FD9FF}
:root[data-sk=p3] .big.today .mu{color:#1c3a6b}
:root[data-sk=p3] .big:active,:root[data-sk=p3] .cta:active,:root[data-sk=p3] .sec:active{transform:translateX(5px);filter:brightness(1.25)}
:root[data-sk=p3] .cta{border-radius:0;background:linear-gradient(90deg,#3FD9FF,#7BE9FF);color:#04122B;font-size:24px;font-weight:700;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 100%,20px 100%);box-shadow:0 0 22px rgba(63,217,255,.45)}
:root[data-sk=p3] .cta.warn{background:#FFD166;color:#1a1200}
:root[data-sk=p3] .sec,:root[data-sk=p3] .dys button,:root[data-sk=p3] .rir button,:root[data-sk=p3] .feels button,:root[data-sk=p3] .step button{border-radius:0;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 100%,8px 100%)}
:root[data-sk=p3] .sec.on,:root[data-sk=p3] .dys .on{background:#3FD9FF;color:#04122B;border-color:#3FD9FF}
:root[data-sk=p3] .rir .on{background:#fff;color:#06122B;border-color:#fff}
:root[data-sk=p3] .feels .on{color:#04122B}
:root[data-sk=p3] .note{border-radius:0;border-left-color:#3FD9FF;background:rgba(7,23,53,.9)}
:root[data-sk=p3] .b{border-radius:0;border-width:0;background:#12306A;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:5px 14px}
:root[data-sk=p3] .b-kg{background:#FFD166;color:#1a1200}:root[data-sk=p3] .b-s{background:#3FD9FF;color:#04122B}:root[data-sk=p3] .b-rep{background:#A9C4FF;color:#06122B}:root[data-sk=p3] .b-ok{background:#4DF0B0;color:#04122B}:root[data-sk=p3] .b-ko{background:#FF6B8A;color:#1a0008}
:root[data-sk=p3] .xp,:root[data-sk=p3] .sc{border-radius:0;height:12px;background:#0b1f45;transform:skewX(-20deg);border:1px solid #1F4C94}
:root[data-sk=p3] .xp i{background:linear-gradient(90deg,#1b78d6,#3FD9FF);box-shadow:0 0 10px #3FD9FF}
:root[data-sk=p3] .rd:before{background:#3FD9FF;width:3px}
:root[data-sk=p3] .nc{border-radius:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border:0;background:#12306A;color:#8FB3DE}
:root[data-sk=p3] .nc.dn{background:#fff;color:#06122B}
:root[data-sk=p3] .nc.cu{background:#3FD9FF;color:#04122B;outline:0;animation:pulse 1.4s ease-in-out infinite}
:root[data-sk=p3] #tm{background:#0F3A8A;color:#fff;border-top:2px solid #3FD9FF}
:root[data-sk=p3] #tm button{border-radius:0;background:#06122B;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 100%,8px 100%)}
:root[data-sk=p3] .hint{color:#3FD9FF}
:root[data-sk=p3] .recb{background:#3FD9FF;color:#04122B;font-family:Oswald,Impact,sans-serif;font-weight:700;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,22px 100%);transform:skewX(-8deg);animation:slamb .5s cubic-bezier(.2,1.4,.4,1)}
.wipe.p3{background:linear-gradient(90deg,#06122B 0 33%,#0F3A8A 33% 66%,#3FD9FF 66%);animation:wipe .45s cubic-bezier(.7,0,.3,1) forwards}

/* ---- Style p4 ---- */
:root[data-sk=p4]{--bg:#110E00;--card:#1E1805;--in:#120F02;--line:#7a6100;--tx:#FFF8DC;--mu:#D6C378;--kg:#FFD21F;--s:#FF8A00;--rep:#FFFFFF;--ok:#7CE35B;--ko:#FF5C5C;--bt:#2f2606;--tmbg:#1E1805;--tmb:#7a6100}
:root[data-sk=p4] body{background:radial-gradient(rgba(255,210,31,.14) 1.4px,transparent 2px) 0 0/12px 12px,repeating-linear-gradient(0deg,rgba(255,210,31,.05) 0 2px,transparent 2px 6px),#110E00;background-attachment:fixed;animation:scan 14s linear infinite}
:root[data-sk=p4] h1,:root[data-sk=p4] h2,:root[data-sk=p4] .big,:root[data-sk=p4] .cta,:root[data-sk=p4] .sec,:root[data-sk=p4] .back,:root[data-sk=p4] .dys button,:root[data-sk=p4] .b,:root[data-sk=p4] .nl b{font-family:'Lilita One',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.04em}
:root[data-sk=p4] h1{font-size:38px;color:#FFD21F;transform:rotate(-1.5deg);text-shadow:3px 3px 0 #000,5px 5px 0 #FF8A00;margin:12px 0 8px;letter-spacing:.03em}
:root[data-sk=p4] h2{font-size:21px;color:#FFD21F;display:inline-block;background:#000;padding:2px 12px;transform:rotate(-1deg);border:2px solid #FFD21F;border-radius:6px}

   if(mc.pf!=null&&mc.pf>bst('pf'))ent.pr.push('perf.');if(mc.rm&&mc.rm>bst('rm')+.01)ent.pr.push('1RM ≈ '+rd1(mc.rm)+' kg')}
  res.push(ent)}
 if(!res.length)return alert('Valide au moins une série avant de terminer.');
 xp+=60;
 const wv0={n:S.wv.n,w:S.wv.w};let roll=0;
 if(wvOn()&&day!=='jeudi'){S.wv.n++;if(S.wv.n>=wvLn()){S.wv.n=0;S.wv.w++;roll=1;for(const d in P)P[d].forEach(e=>{const k=d+'.'+e.id,v=cur(d,e),x=curx(d,e),[nv,nx]=T[e.t].dn(v,x);if(nv!==v)S.p[k]=nv;if(nx!==x)S.p[k+'.x']=nx})}}
 const u={p:{},lv:{}};if(wv0.n!==S.wv.n||wv0.w!==S.wv.w)u.wv=[[wv0.n,wv0.w],[S.wv.n,S.wv.w]];if(roll)u.wb=1;for(const k of new Set([...Object.keys(p0),...Object.keys(S.p)]))if(p0[k]!==S.p[k])u.p[k]=[p0[k]??null,S.p[k]??null];
 for(const k in S.lv)if(lv0[k]!==S.lv[k])u.lv[k]=[lv0[k],S.lv[k]];
 const h={d:iso,day,xp,res,rd:SE.rd,sc:SE.sc??null,pn:{...SE.pn},wu:SE.wu.length?SE.wu.filter(Boolean).length+'/'+SE.wu.length:null,ex:SE.expr?1:0,eq:SE.eq?1:0,wk:SE.wk??null,ro:roll,u};
 S.h.push(h);compactH(S.h);if(roll)S.wb.push(mkBilan(S.wv.w-1));S.xp+=xp;buildP();save();backup('Après séance');V.last=h;nav('res')},
delh:d=>{const i=+d.i,h=S.h[i];if(!h)return;
 if(!cf('Supprimer la séance du '+dfr(h.d)+' ?\n'+(h.u?'La progression qu’elle a déclenchée est annulée (sauf si une séance plus récente l’a déjà modifiée).':'Séance ancienne : sa progression ne peut pas être annulée automatiquement.')+'\nUne copie de secours est conservée.'))return;
 backup('Avant suppression');const u=h.u||{p:{},lv:{}};
 for(const k in u.p){const[o,n]=u.p[k];if(S.p[k]===n){if(o===null)delete S.p[k];else S.p[k]=o}}
 for(const k in u.lv){const[o,n]=u.lv[k];if(S.lv[k]===n)S.lv[k]=o}
 if(u.wv){const[o,n]=u.wv;if(S.wv.n===n[0]&&S.wv.w===n[1]){S.wv.n=o[0];S.wv.w=o[1];if(u.wb)S.wb.pop()}}
 S.xp=Math.max(0,S.xp-(h.xp||0));S.h.splice(i,1);buildP();save();render()},
sm:d=>{V.sm[d.k]=d.m;render()},
ui:d=>{UI[d.k]=d.k==='z'||d.k==='cl'?+d.v:d.v;saveUI();applyUI();render()},
rdt:d=>{UI.rd[d.k]=UI.rd[d.k]?0:1;saveUI();render()},
ics:()=>{const t=icsText();if(!t)return alert('Choisis au moins un jour.');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/calendar'}));a.download='rappels-seances.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},
vr:d=>{const day=V.day,e=P[day].find(x=>x.id===d.id),i=+d.i,old=vri(day,e);if(!e||i===old||!VAR[e.id]||i<0||i>VAR[e.id].length)return;
 if(!cf('Passer à « '+(i?VAR[e.id][i-1]:'Standard')+' » ?'+(i?'\nLes cibles sont réduites pour repartir proprement.':'')))return;
 backup('Avant changement de variante');const key=day+'.'+e.id;
 if(i)S.vr[key]=i;else delete S.vr[key];
 if(i){const v=cur(day,e),x=curx(day,e);
  if(e.t==='pyr')S.p[key]=Math.max(3,Math.round(v*.6));else if(e.t==='emom')S.p[key]=Math.max(2,Math.round(v*.6));else if(e.t==='reps')S.p[key]=Math.max(3,Math.round(v*.6));else if(e.t==='hold')S.p[key]=Math.max(10,Math.round(v*.8));else if(e.t==='dp')S.p[key+'.x']=Math.max(3,x-2)}
 save();render()},
bwd:d=>{V.bwv=Math.max(30,Math.min(250,Math.round((bwVal()+ +d.s*.5)*2)/2));render()},
bws:()=>{const kg=bwVal(),iso=new Date().toISOString(),day=iso.slice(0,10);S.bw=S.bw.filter(b=>b.d.slice(0,10)!==day);S.bw.push({d:iso,kg});S.bw.sort((a,b)=>a.d<b.d?-1:1);save();render()},
exp:async()=>{const j=JSON.stringify(S),nme='carnet-calisthenie-'+new Date().toISOString().slice(0,10)+'.json',mark=()=>{S.bk=Date.now();save();render()};
 try{const f=new File([j],nme,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Carnet de séance'});return mark()}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=nme;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);mark()},
imp:()=>$('#imp').click(),
cpy:()=>{const j=JSON.stringify(S),t=$('#ta');t.value=j;t.focus();t.select();S.bk=Date.now();save();let ok=false;try{ok=document.execCommand('copy')}catch(e){};(ok?Promise.resolve():navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert('Données copiées. Colle-les dans une note.'),()=>alert('Copie manuelle : le texte est dans la zone, sélectionne-le et copie-le.'))},
pst:()=>{let o;try{o=JSON.parse($('#ta').value.trim());if(!Array.isArray(o.h))throw 0}catch(x){return alert('Texte invalide : colle exactement les données copiées.')}
 if(!cf('Restaurer '+o.h.length+' séance(s) ? Tes données actuelles ('+S.h.length+' séance(s)) seront remplacées. Une copie de secours est conservée.'))return;
 replaceState(o,'Avant restauration');alert('Sauvegarde restaurée.');nav('home')},
rsn:d=>{const s=(V.snaps||[]).find(x=>x.t===+d.t);if(!s)return;let o;try{o=JSON.parse(s.data)}catch(e){return alert('Copie illisible.')}
 if(!cf('Revenir à la copie « '+s.label+' » du '+dfr(s.t)+' ('+s.n+' séance(s)) ? Tes données actuelles seront d’abord copiées.'))return;
 replaceState(o,'Avant retour arrière');alert('Copie restaurée.');nav('home')},
rst:()=>{if(!cf('Effacer tout l’historique, les progressions et la séance en pause ?\nUne copie de secours est conservée (Texte et copies).'))return;
 backup('Avant effacement');clearInterval(eI);A.tx();S=norm(null);buildP();RS=null;SE=null;V.last=null;try{localStorage.removeItem(SKEY)}catch(e){}kvDel('ses');save();nav('home')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!A[b.dataset.a])return;const nme=b.dataset.a,d={...b.dataset};
 const run=ok=>{CFD=1;CFOK=ok;CFP=null;try{A[nme](d)}catch(err){toast('Erreur : '+err.message+' (montre-le à Claude)',1)}finally{CFD=0;CFOK=0}return CFP};
 const m=run(0);if(m)showAsk(m,()=>run(1))});
document.addEventListener('change',e=>{if(e.target.id==='rt'){UI.rt=/^\d\d:\d\d$/.test(e.target.value)?e.target.value:'18:00';saveUI()}});
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result);if(!Array.isArray(o.h))throw 0}catch(x){return alert('Fichier invalide.')}
 showAsk('Importer '+o.h.length+' séance(s) ? Tes données actuelles ('+S.h.length+' séance(s)) seront remplacées. Une copie de secours est conservée.',()=>{replaceState(o,'Avant import');S.bk=Date.now();save();nav('home');alert('Sauvegarde importée.')})};r.readAsText(f);e.target.value=''});
try{navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
applyUI();
render();
