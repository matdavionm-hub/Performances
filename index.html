<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Carnet de séance · Calisthénie</title>
<style>
:root{--bg:#0E1220;--card:#171C2E;--in:#10152A;--line:#283050;--tx:#E9ECF6;--mu:#8A93B2;--kg:#F5B53D;--s:#4DD6E8;--rep:#B08CFF;--ok:#5BE3A0;--ko:#FF6B7A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:32px;font-weight:900;letter-spacing:-.03em;margin:8px 0 2px}
h2{font-size:19px;font-weight:800;margin:0}
p{margin:4px 0 12px}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--s);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:68px;padding:14px 18px;margin:10px 0;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800;text-align:left}
.big.today{border-color:var(--s);box-shadow:inset 0 0 0 1px var(--s)}
.back{background:none;color:var(--mu);padding:12px 4px;font-size:16px}
.b{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;padding:5px 11px;border-radius:999px;font-weight:800;font-size:15px;border:1.5px solid}
.b i{font-style:normal;font-size:12px}
.b-kg{color:var(--kg);border-color:var(--kg);background:#F5B53D22}
.b-s{color:var(--s);border-color:var(--s);background:#4DD6E822}
.b-rep{color:var(--rep);border-color:var(--rep);background:#B08CFF22}
.b-ok{color:var(--ok);border-color:var(--ok);background:#5BE3A022}
.b-ko{color:var(--ko);border-color:var(--ko);background:#FF6B7A22}
.b-mu{color:var(--mu);border-color:var(--line)}
.up{color:var(--ok)}.dn{color:var(--ko)}
.note{margin-top:8px;padding:8px 10px;border-left:3px solid var(--s);background:var(--in);border-radius:6px;font-size:14px;color:var(--mu)}
.note.w{border-color:var(--kg)}.note.d{border-color:var(--ko)}
.pyr{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.pyr span{min-width:30px;text-align:center;padding:4px 0;border-radius:8px;background:var(--in);font-weight:800}
.pyr .hi{background:#B08CFF33;color:var(--rep)}
.lab{font-size:14px;color:var(--mu);margin:6px 0 4px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step button{width:56px;height:56px;border-radius:14px;background:#222B4A;font-size:28px;font-weight:800}
.step output{flex:1;text-align:center;font-size:24px;font-weight:900}
.feels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.feels button{min-height:52px;padding:8px;border-radius:12px;background:var(--in);border:1.5px solid var(--line);font-weight:700;font-size:15px}
.feels .on{color:#06121A}
.feels [data-k=facile].on{background:var(--s);border-color:var(--s)}
.feels [data-k=parfait].on{background:var(--ok);border-color:var(--ok)}
.feels [data-k=dur].on{background:var(--kg);border-color:var(--kg)}
.feels [data-k=echec].on{background:var(--ko);border-color:var(--ko)}
.cta{width:100%;min-height:60px;margin:14px 0;border-radius:16px;background:var(--ok);color:#052013;font-weight:900;font-size:19px}
.cta.warn{background:var(--kg);color:#241600}
.sec{min-height:48px;padding:0 14px;margin:4px 4px 4px 0;border-radius:12px;background:#222B4A;font-weight:700}
.sec.on{background:var(--s);color:#06121A}
.xp{height:10px;border-radius:9px;background:var(--in);overflow:hidden;margin-top:8px}
.xp i{display:block;height:100%;background:var(--s)}
.hr{padding:3px 0;border-top:1px solid var(--line);margin-top:4px}
#tm{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#1B2240;border-top:1px solid var(--line);font-size:22px;font-weight:900}
#tm button{min-width:64px;height:48px;margin-left:8px;border-radius:12px;background:#2B3560;font-size:15px;font-weight:700}
.rir{display:flex;gap:6px}.rir button{flex:1;height:48px;border-radius:12px;background:var(--in);border:1.5px solid var(--line);font-weight:800;font-size:15px}.rir .on{background:var(--rep);border-color:var(--rep);color:#12082A}
.wui{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;padding:10px 12px;margin:6px 0;border-radius:12px;background:var(--in);border:1.5px solid var(--line);text-align:left}
.wui.on{border-color:var(--ok);background:#5BE3A022}
.ban{border-color:var(--kg);background:#F5B53D18}
textarea{width:100%;min-height:120px;background:var(--in);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:10px;font:13px monospace;margin-bottom:8px}
svg text{fill:var(--mu);font-size:11px}
</style>
</head>
<body>
<main id="app"></main>
<div id="tm"><b id="tt"></b><span><button data-a="t+">+15 s</button><button data-a="tx">Fermer</button></span></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const VER=2,KEY='calisthenie_v1',SKEY='calisthenie_se',PKEY='calisthenie_prev',DAYS={mardi:'Mardi',mercredi:'Mercredi',samedi:'Samedi',dimanche:'Dimanche'},DOW={mardi:2,mercredi:3,samedi:6,dimanche:0};
const $=s=>document.querySelector(s);
const D=()=>({h:[],p:{},xp:0,lv:{pl:0,fl:1},bk:0,bw:[],t:0,ver:VER});

/* ---- Programme (v = variable qui progresse ; rl = le repos de base baisse peu à peu ; zn = zones sollicitées ; bw = poids de corps ajouté au calcul du 1RM) ---- */
const HB={id:'hb',n:'Hollow Body',t:'hold',sets:3,v:45,rl:1};
const P={
 mardi:[HB,
  {id:'pl',n:'Planche Lean',t:'hold',sets:4,v:15,rest:120},
  {id:'tr',n:'Tractions · Pyramide',t:'pyr',v:6},
  {id:'di',n:'Dips · Force',t:'kg',sets:3,reps:3,v:20},
  {id:'po',n:'Pompes · EMOM',t:'emom',m:10,v:8}],
 mercredi:[HB,
  {id:'tp',n:'Planche',lad:'pl',t:'hold',sets:5,v:5},
  {id:'tr',n:'Tractions · Force',t:'reps',sets:3,v:6},
  {id:'di',n:'Dips · EMOM',t:'emom',m:10,v:4},
  {id:'po',n:'Pompes surélevées · Force',t:'reps',sets:3,v:8,rest:300},
  {id:'sp',n:'Scapula Pull-up',t:'kg',sets:4,reps:8,v:5,rest:240,note:'Pause de 3 s en haut de chaque rep.'}],
 samedi:[HB,
  {id:'tp',n:'Planche',lad:'pl',t:'hold',sets:5,v:8,rest:120},
  {id:'ng',n:'Front Lever · Negative hold',fig:1,t:'hold',sets:4,v:3,rest:120,note:'Full FL : tiens le plus longtemps en haut, puis redescends en contrôle.'},
  {id:'tr',n:'Tractions · Pyramide',t:'pyr',v:7},
  {id:'di',n:'Dips · EMOM',t:'emom',m:10,v:4},
  {id:'ah',n:'Arch Hangs',t:'reps',sets:3,v:8,rl:1}],
 dimanche:[HB,
  {id:'tp',n:'Planche',lad:'pl',t:'hold',sets:4,v:7,rest:90},
  {id:'fl',n:'Front Lever',lad:'fl',t:'hold',sets:3,v:9,rest:90},
  {id:'tr',n:'Tractions · Force',t:'reps',sets:3,v:6,note:'Nombre de reps variable selon la forme du jour.'},
  {id:'di',n:'Dips · Force',t:'kg',sets:3,reps:3,v:20},
  {id:'po',n:'Pompes · EMOM',t:'emom',m:10,v:8},
  {id:'sp',n:'Scapula Pull-up',t:'kg',sets:4,reps:8,v:5,note:'Pause de 3 s en haut de chaque rep.'}]
};
const T={
 hold:{c:'s',l:'Temps tenu par série',mx:2,up:(v,x)=>[v+1,x],dn:(v,x)=>[Math.max(3,Math.min(v-1,Math.round(v*.9))),x]},
 reps:{c:'rep',l:'Reps réalisées par série',mx:1,up:(v,x)=>[v+1,x],dn:(v,x)=>[Math.max(1,v-1),x]},
 kg:{c:'kg',l:'Lest utilisé',mx:2,up:(v,x)=>[v+1,x],dn:(v,x)=>[Math.max(0,v-2),x]},
 pyr:{c:'rep',mx:1,up:(v,x)=>x>60?[v,x-10]:[v+1,90],dn:(v,x)=>x<90?[v,x+10]:[Math.max(3,v-1),60]},
 emom:{c:'rep',l:'Reps par minute réalisées',mx:1,up:(v,x)=>x<12?[v,x+2]:[v+1,10],dn:(v,x)=>x>10?[v,x-2]:[Math.max(2,v-1),12]}
};
/* Séances Force : double progression (reps puis charge) + repos 5 min. v = charge (kg, 0 = poids du corps), x = reps par série */
T.dp={c:'kg',l:'Lest utilisé',mx:1,up:(v,x)=>v?(x<6?[v,x+1]:[v+2,3]):(x<15?[v,x+1]:[10,3]),dn:(v,x)=>v?(x>3?[v,x-1]:[Math.max(0,v-2),6]):[v,Math.max(3,x-1)]};
for(const d in P)P[d]=P[d].map(e=>/Force/.test(e.n)?e.id==='di'?{...e,t:'dp',x0:3,rest:300,note:'3 → 6 reps ; quand 3×6 devient facile : +2 kg et retour à 3 reps.'}:e.id==='tr'?{id:'tf',n:'Tractions · Force',t:'dp',sets:3,x0:6,v:0,rest:300,note:'Poids du corps jusqu’à 15 strictes, puis lestées : 3 → 6 reps, puis +2 kg.'}:{...e,rest:300}:e);
/* Technique à contrôler par série, zones sollicitées (c = coudes, p = poignets, e = épaules) */
const TK={tr:['amp','elan'],tf:['amp','elan'],di:['amp','elan'],po:['amp','elan'],sp:['amp','pause']},TKL={amp:'Amplitude complète',elan:'Sans élan',pause:'Pause 3 s respectée'};
const ZN={tr:['c','e'],tf:['c','e'],di:['c','e'],po:['p','e','c'],pl:['p','e','c'],tp:['p','e','c'],fl:['e','c'],ng:['e','c'],sp:['e'],ah:['e']},ZL={c:'Coudes',p:'Poignets',e:'Épaules'};
for(const d in P)P[d]=P[d].map(e=>({...e,tk:TK[e.id],zn:ZN[e.id]||[],bw:e.id==='di'||e.id==='tf'?1:0}));
/* Paliers des figures : [nom, secondes à tenir en bonne forme pour passer au niveau suivant] */
const L={pl:[['Tuck Planche',20],['Advanced Tuck Planche',15],['Straddle Planche',12],['Full Planche',10]],fl:[['Tuck Front Lever',20],['Advanced Tuck FL',15],['One Leg FL',12],['Straddle FL',10],['Full Front Lever',10]]};
const R=['Recrue','Initié','Athlète','Gladiateur','Maître','Légende'];

/* ---- Données : validation, stockage (localStorage + IndexedDB), sauvegardes ---- */
function norm(o){const d=D();if(!o||typeof o!=='object'||Array.isArray(o))return d;
 const s={...d,...o};
 s.h=(Array.isArray(o.h)?o.h:[]).filter(h=>h&&P[h.day]&&Array.isArray(h.res)).map(h=>({...h,xp:+h.xp||0,res:h.res.filter(r=>r&&r.id&&T[r.t])}));
 s.p={};if(o.p&&typeof o.p==='object')for(const k in o.p)if(typeof o.p[k]==='number'&&isFinite(o.p[k]))s.p[k]=o.p[k];
 s.lv={};for(const k in L){const v=o.lv?+o.lv[k]:NaN;s.lv[k]=Math.max(0,Math.min(L[k].length-1,isFinite(v)?v|0:d.lv[k]))}
 s.xp=Math.max(0,+o.xp||0);s.bk=+o.bk||0;s.t=+o.t||0;
 s.bw=(Array.isArray(o.bw)?o.bw:[]).filter(b=>b&&isFinite(b.kg)&&b.kg>0&&typeof b.d==='string').map(b=>({d:b.d,kg:+b.kg})).sort((a,b)=>a.d<b.d?-1:1);
 s.ver=VER;delete s.max;return s}
function load(){try{return norm(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return D()}}
const idb={db:null,run(st,mode,fn){return new Promise((res,rej)=>{try{
 const go=db=>{const t=db.transaction(st,mode);let q;t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);q=fn(t.objectStore(st))};
 if(idb.db)return go(idb.db);
 const o=indexedDB.open('calisthenie',1);o.onupgradeneeded=()=>{o.result.createObjectStore('kv');o.result.createObjectStore('snap',{keyPath:'t'})};o.onsuccess=()=>{idb.db=o.result;go(idb.db)};o.onerror=()=>rej(o.error)}catch(e){rej(e)}})}};
const kvGet=k=>idb.run('kv','readonly',s=>s.get(k)).catch(()=>null);
const kvSet=(k,v)=>idb.run('kv','readwrite',s=>s.put(v,k)).then(()=>true,()=>false);
const kvDel=k=>idb.run('kv','readwrite',s=>s.delete(k)).catch(()=>{});
async function snapPut(rec){try{await idb.run('snap','readwrite',s=>s.put(rec));const ks=await idb.run('snap','readonly',s=>s.getAllKeys());for(const k of ks.slice(0,Math.max(0,ks.length-15)))await idb.run('snap','readwrite',s=>s.delete(k))}catch(e){}}
let S=load(),V={v:'home',day:null,last:null,sm:{},snaps:null},SE=null;
function save(){S.t=Date.now();const j=JSON.stringify(S);let ok=true;try{localStorage.setItem(KEY,j)}catch(e){ok=false}
 kvSet('state',j).then(k=>{if(!k&&!ok&&!save.w){save.w=1;alert('Sauvegarde impossible : le stockage du navigateur est indisponible.')}})}
/* copie de secours (dernière copie dans localStorage + 15 dernières dans IndexedDB) */
function backup(label){const rec={t:Date.now(),label,n:S.h.length,data:JSON.stringify(S)};try{localStorage.setItem(PKEY,JSON.stringify(rec))}catch(e){}snapPut(rec)}
async function loadSnaps(){let l=[];try{l=(await idb.run('snap','readonly',s=>s.getAll()))||[]}catch(e){}
 if(!l.length){try{const p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p)l=[p]}catch(e){}}
 V.snaps=l.sort((a,b)=>b.t-a.t);if(V.v==='sav')render()}
function replaceState(o,label){backup(label);S=norm(o);save();V.last=null}

/* ---- Séance en cours (sauvegardée pour pouvoir reprendre) ---- */
const sv=()=>{try{if(SE){const j=JSON.stringify({SE,day:V.day,t:Date.now()});localStorage.setItem(SKEY,j);kvSet('ses',j)}else{localStorage.removeItem(SKEY);kvDel('ses')}}catch(e){}};
let RS=(()=>{try{const o=JSON.parse(localStorage.getItem(SKEY)||'null');return o&&o.SE&&o.SE.g&&P[o.day]?o:null}catch(e){return null}})();
(async()=>{try{
 const j=await kvGet('state');
 if(j){const o=norm(JSON.parse(j));if(o.t>S.t){S=o;try{localStorage.setItem(KEY,j)}catch(e){}}else if(S.t>o.t)kvSet('state',JSON.stringify(S))}
 else if(S.h.length||S.xp)kvSet('state',JSON.stringify(S));
 const sj=await kvGet('ses');
 if(sj&&!SE){const o=JSON.parse(sj);if(o&&o.SE&&o.SE.g&&P[o.day]&&(!RS||(o.t||0)>(RS.t||0)))RS=o}
 if(V.v==='home')render()}catch(e){}})();

/* ---- V2 : séance guidée (série par série) ---- */
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function beep(f,d){try{const c=beep.c||(beep.c=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();c.resume&&c.resume();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
let WL=null,eI;
const wake=async()=>{try{WL=await navigator.wakeLock.request('screen')}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SE&&SE.g)wake()});
const cs=()=>{const g=SE.g,e=P[V.day][g.ei],r=SE.ex[e.id];return{g,e,r,o:r.L[g.si]}};
const seq=n=>{const a=[];for(let i=1;i<=n;i++)a.push(i);for(let i=n-1;i>0;i--)a.push(i);return a};
const mmss=s=>Math.floor(s/60)+':'+String(Math.round(s)%60).padStart(2,'0');
const tt=(e,r,i)=>e.t==='pyr'?seq(r.tg)[i]+' reps':e.t==='kg'?e.reps+' reps · '+fmt(e,r.tg):fmt(e,r.tg,r.x);
const setStr=(e,o)=>e.t==='hold'?o.a+' s':e.t==='kg'?'+'+o.a+' kg':e.t==='dp'?o.ax+' reps'+(o.a?' · +'+o.a+' kg':''):e.t==='emom'?o.a+' reps/min':o.a+' reps';
const lastSets=(d,e)=>{const p=last(d,e.id);return p&&p.ss&&p.ss.length?p.ss:null};
const lt=(d,e)=>{const p=last(d,e.id);if(!p)return'';const s=p.ss&&p.ss.length>1?`<div class=mu>Série par série : ${p.ss.map(o=>setStr(p.t?{t:p.t}:e,o)).join(' · ')}</div>`:'';return `<div class=mu>La dernière fois : ${fmt(p,p.act,p.x)}${p.q!=null?' · RIR '+p.q:''}${p.a==='up'?' ▲':''}</div>${s}`};
const beat=(d,e,i,n)=>{const s=lastSets(d,e);return s&&s[i]&&(e.t!=='pyr'||s.length===n)?`<div class=mu>À battre (dernière fois) : <b>${setStr(e,s[i])}</b></div>`:''};
const effv=o=>{const a=[o.q,o.p==null?null:10-o.p].filter(v=>v!=null);return a.length?Math.min(...a):null};
const pn=e=>Math.max(0,...(e.zn||[]).map(z=>SE.pn[z]||0));
/* repos conseillé = repos de base × effort de la série qui vient d'être faite (entre 60 % et 150 % du repos de base) */
function radv(){const{g,e,r,o}=cs(),b=restOf(e,g.si,r)||90,q=o?effv(o):null;let f=1;
 if(q!=null)f=q<0?1.3:q===0?1.25:q===1?1.1:q>=3?.85:1;
 if(o&&((o.bad&&o.bad.length)||o.pa))f*=1.1;
 return Math.round(Math.min(b*1.5,Math.max(30,b*.6,b*f))/5)*5}
/* le chrono de repos suit automatiquement les réponses de l'utilisateur, tant qu'il ne l'a pas réglé à la main */
function reRest(){const g=SE.g;if(g.ph!=='rest'||g.rman)return;const s=radv();g.radv=s;if(tP)return;tEnd=g.rstart+s*1000;g.rend=tEnd;clearInterval(tI);if(tEnd>Date.now()){tI=setInterval(tick,250);tick()}}
/* ajuste la cible de la série suivante et affiche des conseils d'après la série qui vient d'être saisie */
function adj(){const{g,e,o}=cs();g.cur2=g.cur;const m=[];
 if(e.t==='hold'&&(o.a<.8*g.cur||o.fm==='bad')){g.cur2=Math.max(3,g.cur-1);m.push('Cible −1 s sur la prochaine série ('+(o.fm==='bad'?'forme moyenne':'tenue courte')+').')}
 else if(o.q>=3&&(e.t==='dp'||e.t==='kg'))m.push('RIR '+(o.q>=4?'4+':o.q)+' : tu peux ajouter +2 kg sur la série suivante.');
 else if(o.q===0)m.push('Limite atteinte : le repos conseillé est allongé.');
 if(o.q===-1&&e.t!=='hold')m.push('Rep d’échec : n°'+((e.t==='dp'?o.ax:o.a)+1)+' (non comptée).');
 if(o.bad&&o.bad.length)m.push('Technique non propre : cette série ne comptera pas pour la progression.');
 if(o.pa)m.push(o.pa+' rep'+(o.pa>1?'s':'')+' partielle'+(o.pa>1?'s':'')+' : elles ne sont pas comptées.');
 g.msg=m.join(' ')}
/* convertit les séries saisies en résumé d'exercice pour le moteur de progression (A.fin) */
function drv(e){const r=SE.ex[e.id],Ls=r.L.filter(Boolean);if(!Ls.length)return;
 if(e.t!=='emom')r.L.forEach((o,i)=>{if(o)r.d[i]=e.t==='pyr'?o.a>=seq(r.tg)[i]:true});
 if(e.t==='pyr'){let pk=0;r.L.forEach((o,i)=>{if(o&&o.a>=seq(r.tg)[i])pk=Math.max(pk,seq(r.tg)[i])});r.a=pk}
 else r.a=Math.min(...Ls.map(o=>o.a));
 if(e.t==='dp')r.ax=Math.min(...Ls.map(o=>o.ax));
 r.nc=Ls.filter(o=>o.bad&&o.bad.length).length;r.pa=Ls.reduce((s,o)=>s+(o.pa||0),0);
 const es=Ls.map(effv).filter(v=>v!=null),ps=Ls.map(o=>o.p).filter(v=>v!=null);

 if(r.t==='hold'||r.t==='reps'){o.pf=mx(s=>s.a);o.vol=sm(s=>s.a)}

 else if(r.t==='dp'){o.pf=ul?mx(s=>s.a):mx(s=>s.ax);o.vol=sm(s=>s.ax);const wt=s=>s.a+w0,t=sm(s=>s.ax*wt(s));if(t>0)o.ton=t;const m=mx(s=>wt(s)*(1+s.ax/30));if(m>0)o.rm=m}

   ent={id:e.id,n:name,t:e.t,tg,x:e.t==='dp'?r.ax:r.x,act:r.a,dn,sets:n,f:r.f,q:r.q,rp:r.p,fm:r.fm,ok,next:nv,nx,a,msg,ss,lv:lvl,tr:Math.round(trend*100)/100,nc:r.nc||0,pa:r.pa||0,rpl:av('rp'),rpt:av('rt'),rn,pr:[]};
  /* records : meilleure perf ou 1RM estimé jamais atteints sur cet exercice (séance propre et complète) */
  const prev=[];S.h.forEach(h=>h.res.forEach(x=>{if(x.id===e.id&&x.t===e.t)prev.push({h,r:x})}));

   if(mc.pf!=null&&mc.pf>bst('pf'))ent.pr.push('perf.');if(mc.rm&&mc.rm>bst('rm')+.01)ent.pr.push('1RM ≈ '+rd1(mc.rm)+' kg')}
  res.push(ent)}
 if(!res.length)return alert('Valide au moins une série avant de terminer.');
 xp+=60;
 const u={p:{},lv:{}};for(const k of new Set([...Object.keys(p0),...Object.keys(S.p)]))if(p0[k]!==S.p[k])u.p[k]=[p0[k]??null,S.p[k]??null];
 for(const k in S.lv)if(lv0[k]!==S.lv[k])u.lv[k]=[lv0[k],S.lv[k]];
 const h={d:iso,day,xp,res,rd:SE.rd,pn:{...SE.pn},wu:SE.wu.length?SE.wu.filter(Boolean).length+'/'+SE.wu.length:null,u};
 S.h.push(h);S.xp+=xp;save();backup('Après séance');V.last=h;nav('res')},
delh:d=>{const i=+d.i,h=S.h[i];if(!h)return;
 if(!confirm('Supprimer la séance du '+dfr(h.d)+' ?\n'+(h.u?'La progression qu’elle a déclenchée est annulée (sauf si une séance plus récente l’a déjà modifiée).':'Séance ancienne : sa progression ne peut pas être annulée automatiquement.')+'\nUne copie de secours est conservée.'))return;
 backup('Avant suppression');const u=h.u||{p:{},lv:{}};
 for(const k in u.p){const[o,n]=u.p[k];if(S.p[k]===n){if(o===null)delete S.p[k];else S.p[k]=o}}
 for(const k in u.lv){const[o,n]=u.lv[k];if(S.lv[k]===n)S.lv[k]=o}
 S.xp=Math.max(0,S.xp-(h.xp||0));S.h.splice(i,1);save();render()},

exp:async()=>{const j=JSON.stringify(S),nme='carnet-calisthenie-'+new Date().toISOString().slice(0,10)+'.json',mark=()=>{S.bk=Date.now();save();render()};

};
